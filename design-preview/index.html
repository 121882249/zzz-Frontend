<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TokenPro · 宇宙登录界面</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #02040b;
      color: #f7f8ff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(52, 79, 174, .18), transparent 38%),
        #02040b;
    }
    button, input { font: inherit; }
    .window {
      width: calc(100vw - 28px);
      height: calc(100vh - 28px);
      min-width: 980px;
      min-height: 680px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(186, 203, 255, .2);
      border-radius: 24px;
      background: #050816 url("../Resources/LoginCosmos-v2.png") center / cover no-repeat;
      box-shadow: 0 34px 90px rgba(0, 0, 0, .62), inset 0 1px rgba(255,255,255,.08);
    }
    .window::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(3, 6, 18, .24) 0 43%, rgba(2, 5, 16, .48) 58%, rgba(2, 4, 12, .72));
    }
    .titlebar {
      height: 52px;
      padding: 0 22px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      position: relative;
      z-index: 3;
      border-bottom: 1px solid rgba(207, 218, 255, .12);
      background: rgba(3, 6, 17, .52);
      backdrop-filter: blur(18px);
    }
    .traffic { display: flex; gap: 9px; }
    .traffic i { width: 11px; height: 11px; border-radius: 50%; background: rgba(226, 232, 255, .26); }
    .traffic i:first-child { background: #ff5f57; }
    .traffic i:nth-child(2) { background: #febc2e; }
    .traffic i:nth-child(3) { background: #28c840; }
    .wordmark { font-size: 12px; font-weight: 700; letter-spacing: .22em; color: rgba(242,245,255,.82); }
    .platform { justify-self: end; font-size: 11px; letter-spacing: .08em; color: rgba(216,223,248,.5); }
    main {
      height: calc(100% - 52px);
      display: grid;
      grid-template-columns: minmax(500px, 1fr) minmax(540px, .92fr);
      position: relative;
      z-index: 2;
    }
    .hero {
      padding: clamp(54px, 6vh, 76px) clamp(48px, 5vw, 76px) 48px;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #aab9ff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
    }
    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: #7c8fff;
      box-shadow: 0 0 12px #6e84ff;
    }
    h1 {
      max-width: 610px;
      margin: 30px 0 20px;
      font-size: clamp(48px, 4.4vw, 70px);
      line-height: 1.13;
      letter-spacing: -.045em;
      text-shadow: 0 12px 44px rgba(0, 0, 0, .48);
    }
    .lead {
      max-width: 520px;
      margin: 0;
      color: rgba(226, 232, 255, .72);
      font-size: 16px;
      line-height: 1.8;
    }
    .orbit-copy { margin-top: auto; }
    .orbit-label { color: rgba(205, 215, 248, .46); font-size: 11px; letter-spacing: .14em; }
    .clients { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; max-width: 560px; }
    .client {
      display: flex;
      align-items: center;
      gap: 11px;
      height: 50px;
      padding: 8px 17px 8px 9px;
      border: 1px solid rgba(201, 213, 255, .18);
      border-radius: 14px;
      background: rgba(8, 14, 34, .68);
      color: rgba(248, 250, 255, .9);
      box-shadow: inset 0 1px rgba(255,255,255,.07), 0 10px 26px rgba(0,0,0,.2);
      backdrop-filter: blur(18px);
      font-size: 13px;
      font-weight: 650;
    }
    .client img {
      width: 32px;
      height: 32px;
      padding: 6px;
      object-fit: contain;
      border-radius: 9px;
      background: #f7f8fb;
    }
    .client.claude img { padding: 4px; background: rgba(255,255,255,.92); }
    .login-side { display: grid; place-items: center; padding: 42px 58px 58px 18px; }
    .login-card {
      width: min(520px, 100%);
      padding: 42px 44px 38px;
      border: 1px solid rgba(200, 213, 255, .16);
      border-radius: 28px;
      background: linear-gradient(155deg, rgba(18, 25, 55, .86), rgba(7, 11, 29, .78));
      box-shadow: inset 0 1px rgba(255,255,255,.08), 0 34px 80px rgba(0,0,0,.38);
      backdrop-filter: blur(32px) saturate(125%);
    }
    .card-top { display: flex; justify-content: space-between; align-items: center; color: rgba(211,219,246,.5); font-size: 11px; letter-spacing: .09em; }
    .status-dot { display: flex; align-items: center; gap: 8px; }
    .status-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #63e6be; box-shadow: 0 0 12px #63e6be; }
    h2 { margin: 36px 0 9px; font-size: 34px; line-height: 1.2; letter-spacing: -.025em; }
    .sub { margin: 0 0 34px; color: rgba(211,219,246,.58); font-size: 13px; }
    label { display: block; margin: 0 0 9px; color: rgba(235,239,255,.8); font-size: 12px; font-weight: 650; }
    input {
      width: 100%;
      height: 56px;
      margin-bottom: 20px;
      padding: 0 17px;
      color: #f7f8ff;
      border: 1px solid rgba(194, 208, 255, .17);
      border-radius: 14px;
      outline: none;
      background: rgba(3, 7, 22, .5);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
    }
    input::placeholder { color: rgba(192,202,234,.36); }
    input:focus { border-color: #8094ff; box-shadow: 0 0 0 3px rgba(102,124,255,.14), 0 0 24px rgba(91,114,255,.1); }
    .primary {
      width: 100%;
      height: 58px;
      margin-top: 8px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 14px;
      color: white;
      background: linear-gradient(110deg, #6c5cff, #526fff 56%, #3e9bff);
      box-shadow: 0 14px 34px rgba(77, 91, 255, .32), inset 0 1px rgba(255,255,255,.25);
      font-weight: 750;
      cursor: pointer;
    }
    .primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .divider { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; margin: 27px 0 18px; color: rgba(195,205,237,.38); font-size: 11px; }
    .divider::before, .divider::after { content: ""; height: 1px; background: rgba(194,207,255,.12); }
    .privacy { margin: 0; text-align: center; color: rgba(190,201,233,.42); font-size: 11px; }
    @media (max-width: 1100px) {
      main { grid-template-columns: 44% 56%; }
      .hero { padding-left: 44px; padding-right: 32px; }
      h1 { font-size: 45px; }
      .login-side { padding-right: 34px; }
    }
  </style>
</head>
<body>
  <section class="window" aria-label="TokenPro 登录窗口">
    <header class="titlebar">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="wordmark">TOKENPRO</div>
      <div class="platform">UNIVERSAL AI GATEWAY</div>
    </header>
    <main>
      <section class="hero">
        <div class="eyebrow">CROSS-PLATFORM AI ACCESS</div>
        <h1>连接每一颗<br />AI 星辰</h1>
        <p class="lead">GPT 与 Claude，一个入口，跨平台启航。统一管理模型、余额与本地客户端连接。</p>
        <div class="orbit-copy">
          <div class="orbit-label">SUPPORTED CLIENTS</div>
          <div class="clients">
            <div class="client"><img src="../Resources/OpenAIBlossomOfficial.svg" alt="OpenAI" />GPT / Codex</div>
            <div class="client claude"><img src="../Resources/ClaudeSparkOfficial.svg" alt="Claude" />Claude</div>
            <div class="client"><img src="../Resources/OpenAIBlossomOfficial.svg" alt="OpenAI" />Codex CLI</div>
            <div class="client claude"><img src="../Resources/ClaudeSparkOfficial.svg" alt="Claude" />Claude Code</div>
          </div>
        </div>
      </section>
      <section class="login-side">
        <form class="login-card" onsubmit="event.preventDefault(); document.querySelector('.primary').textContent='正在连接…';">
          <div class="card-top"><span class="status-dot">服务运行正常</span><span>简体中文</span></div>
          <h2>登录 TokenPro</h2>
          <p class="sub">进入你的 AI 模型控制中心</p>
          <label for="email">邮箱</label>
          <input id="email" type="email" placeholder="请输入邮箱" autocomplete="email" />
          <label for="password">密码</label>
          <input id="password" type="password" placeholder="请输入密码" autocomplete="current-password" />
          <button class="primary" type="submit">进入控制中心</button>
          <div class="divider">端到端安全连接</div>
          <p class="privacy">登录信息仅加密保存在当前设备</p>
        </form>
      </section>
    </main>
  </section>
</body>
</html>
