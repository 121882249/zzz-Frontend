name: Build desktop clients

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-Apple-Silicon
            os: macos-15
            script: ./java-client/package.sh
          - name: macOS-Intel
            os: macos-15-intel
            script: ./java-client/package.sh
          - name: Windows-x64
            os: windows-latest
            script: ./java-client/package.ps1
          - name: Linux-x64
            os: ubuntu-latest
            script: ./java-client/package.sh
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - if: runner.os != 'Windows'
        run: chmod +x java-client/build.sh java-client/package.sh
      - if: runner.os != 'Windows'
        run: ${{ matrix.script }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v6
        with:
          name: TokenPro-${{ matrix.name }}
          path: java-client/dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
      - name: Prepare uniquely named installers
        run: |
          mkdir release-files
          cp release-assets/TokenPro-macOS-Apple-Silicon/*.dmg "release-files/TokenPro-${GITHUB_REF_NAME}-macOS-arm64.dmg"
          cp release-assets/TokenPro-macOS-Intel/*.dmg "release-files/TokenPro-${GITHUB_REF_NAME}-macOS-x64.dmg"
          cp release-assets/TokenPro-Windows-x64/*.exe "release-files/TokenPro-${GITHUB_REF_NAME}-Windows-x64.exe"
          cp release-assets/TokenPro-Linux-x64/*.deb "release-files/TokenPro-${GITHUB_REF_NAME}-Linux-x64.deb"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --title "TokenPro $GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
