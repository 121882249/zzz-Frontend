name: Build desktop clients

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-Apple-Silicon
            os: macos-15
            script: ./java-client/package.sh
          - name: macOS-Intel
            os: macos-15-intel
            script: ./java-client/package.sh
          - name: Windows-x64
            os: windows-latest
            script: ./java-client/package.ps1
          - name: Linux-x64
            os: ubuntu-latest
            script: ./java-client/package.sh
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - if: runner.os != 'Windows'
        run: chmod +x java-client/build.sh java-client/package.sh
      - if: runner.os != 'Windows'
        run: ${{ matrix.script }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v6
        with:
          name: TokenPro-${{ matrix.name }}
          path: java-client/dist/*
          if-no-files-found: error

  incremental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x java-client/build.sh && ./java-client/build.sh
      - uses: actions/upload-artifact@v6
        with:
          name: TokenPro-incremental
          path: java-client/build/TokenPro-update.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, incremental]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
      - name: Prepare uniquely named installers
        run: |
          mkdir release-files
          cp release-assets/TokenPro-macOS-Apple-Silicon/*.dmg "release-files/TokenPro-${GITHUB_REF_NAME}-macOS-arm64.dmg"
          cp release-assets/TokenPro-macOS-Intel/*.dmg "release-files/TokenPro-${GITHUB_REF_NAME}-macOS-x64.dmg"
          cp release-assets/TokenPro-Windows-x64/*.exe "release-files/TokenPro-${GITHUB_REF_NAME}-Windows-x64.exe"
          cp release-assets/TokenPro-Linux-x64/*.deb "release-files/TokenPro-${GITHUB_REF_NAME}-Linux-x64.deb"
          previous_tag=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1 || true)
          if [ -n "$previous_tag" ] && git diff --quiet "$previous_tag" "$GITHUB_REF_NAME" -- Resources Router.icns Router.ico; then
            cp release-assets/TokenPro-incremental/TokenPro-update.jar "release-files/TokenPro-${GITHUB_REF_NAME}-update.jar"
          else
            echo "Runtime assets changed or no previous release exists; clients will use the full installer."
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-files/* --title "TokenPro $GITHUB_REF_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
      - name: Configure TokenPro download server
        env:
          DEPLOY_KEY: ${{ secrets.TOKENPRO_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.TOKENPRO_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tokenpro-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/tokenpro-deploy ~/.ssh/known_hosts
      - name: Publish installers to tokenpro.work
        env:
          DEPLOY_HOST: ${{ secrets.TOKENPRO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TOKENPRO_DEPLOY_USER }}
        run: |
          remote_dir="/home/${DEPLOY_USER}/tokenpro-release-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/tokenpro-deploy "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '$remote_dir'"
          scp -i ~/.ssh/tokenpro-deploy release-files/* scripts/publish-downloads.sh "${DEPLOY_USER}@${DEPLOY_HOST}:$remote_dir/"
          ssh -i ~/.ssh/tokenpro-deploy "${DEPLOY_USER}@${DEPLOY_HOST}" "sudo bash '$remote_dir/publish-downloads.sh' '$GITHUB_REF_NAME' '$remote_dir' && rm -rf '$remote_dir'"
