name: TokenPro Server Deployment

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Select the TokenPro environment'
        default: inspect
        required: true
        type: choice
        options:
          - inspect
          - stage
          - production
      digest:
        description: 'Verified GHCR manifest digest for 0.2.24-tp.3'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tokenpro-server-deploy
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Configure existing TokenPro deployment credentials
        env:
          DEPLOY_KEY: ${{ secrets.TOKENPRO_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.TOKENPRO_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tokenpro-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/tokenpro-deploy ~/.ssh/known_hosts
      - name: Inspect server container identity (read-only)
        env:
          DEPLOY_HOST: ${{ secrets.TOKENPRO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TOKENPRO_DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/tokenpro-deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo -n bash -s' < scripts/inspect-tokenpro-upgrade.sh
      - name: Deploy explicitly selected backend version
        if: ${{ inputs.target != 'inspect' }}
        env:
          DEPLOY_HOST: ${{ secrets.TOKENPRO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TOKENPRO_DEPLOY_USER }}
          TARGET: ${{ inputs.target }}
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          [[ "$TARGET" == stage || "$TARGET" == production ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/tokenpro-deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n bash -s -- '$TARGET' '$IMAGE_DIGEST'" < scripts/deploy-tokenpro-0.2.24.sh

      - name: Verify public production health
        if: ${{ inputs.target == 'production' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 8 --retry 3 --retry-delay 2 https://tokenpro.work/health | jq -e '.status == "ok"'
