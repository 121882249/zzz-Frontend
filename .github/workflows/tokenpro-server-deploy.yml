name: TokenPro Server Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokenpro-server-deploy
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure existing TokenPro deployment credentials
        env:
          DEPLOY_KEY: ${{ secrets.TOKENPRO_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.TOKENPRO_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tokenpro-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/tokenpro-deploy ~/.ssh/known_hosts
      - name: Inspect server container identity (read-only)
        env:
          DEPLOY_HOST: ${{ secrets.TOKENPRO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.TOKENPRO_DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 -i ~/.ssh/tokenpro-deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo -n docker ps --format "{{.Names}} | {{.Image}} | {{.Status}}"; sudo -n docker ps -q --filter ancestor=ghcr.io/121882249/zzz-backend:TokenPro-R53-v0.2.4 | xargs -r sudo -n docker inspect --format "{{.Name}} | project={{index .Config.Labels \"com.docker.compose.project\"}} | service={{index .Config.Labels \"com.docker.compose.service\"}} | directory={{index .Config.Labels \"com.docker.compose.project.working_dir\"}} | files={{index .Config.Labels \"com.docker.compose.project.config_files\"}}"'
